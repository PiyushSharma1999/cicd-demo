version: "3.8"
 
services:
 
  # ─── Jenkins ───────────────────────────────────────────────────────────────
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    privileged: true                          # needed for Docker socket access
    user: root
    ports:
      - "8080:8080"                           # Jenkins UI
      - "50000:50000"                         # agent port
    volumes:
      - jenkins_home:/var/jenkins_home        # persists all Jenkins data
      - /var/run/docker.sock:/var/run/docker.sock   # Docker-in-host (DinH)
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false  # skip setup wizard
    networks:
      - cicd
 
  # ─── SonarQube ─────────────────────────────────────────────────────────────
  sonarqube:
    image: sonarqube:10-community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    ports:
      - "9000:9000"                           # SonarQube UI
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - cicd
 
  # ─── Postgres (SonarQube database) ─────────────────────────────────────────
  sonar-db:
    image: postgres:15-alpine
    container_name: sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cicd
 
volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:
 
networks:
  cicd:
    driver: bridge